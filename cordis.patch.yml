# dsh-mcp-illustrator — bundle layer
#
# Mounted by the plugin manager (`install_bundle`), or by
# `dsh plugin --profile <profile> add <spec>`.
#
# This bundle declares ONE row, and that row runs no server. It exists so the two Illustrator
# cold-start budgets have a schema this bundle owns, because dsh-settings serves a settings namespace
# — and therefore offers a configuration page — only for an entry whose schema declares a volatile
# field (`x-cordis.volatile`; see lib/index.js).
#
# The MCP client row itself is deliberately NOT declared here. It lives in the profile's own
# cordis.patch.yml next to the profile's other MCP servers, so that this bundle's page lists only what
# this bundle owns. Two consequences, both accepted on purpose:
#
#   - installing this bundle does not wire Illustrator by itself; the profile row has to exist too
#     (README, "The MCP client row lives in the profile")
#   - uninstalling this bundle does not remove that row; delete it separately
#
# The two rows are one feature. The row below carries the budgets; lib/index.js publishes them into
# the host environment and restarts the MCP row after a save, which is what makes a new budget apply.

- insert:
    - id: mcp-illustrator-timeouts
      name: 'dsh-mcp-illustrator'
