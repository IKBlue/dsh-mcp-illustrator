# dsh-mcp-illustrator — bundle layer
#
# Mounted by the plugin manager (`install_bundle`), or by
# `dsh plugin --profile <profile> add <spec>`, so a profile gets this row
# without anyone hand-editing the profile's own cordis.patch.yml.
#
# ONE row. It is DSH's own MCP client, aimed at illustrator-mcp-server; the 66 `mcp__illustrator__*`
# tools are what it registers. Declared here, so installing this bundle wires Illustrator and
# uninstalling it unwires — no hand-editing, and no row left behind.
#
# There is deliberately NO absolute path anywhere in this file. Two things make that work, and both
# matter on a machine that has never seen this repo:
#
#   command: !!js process.execPath
#     The Harness executable, run with ELECTRON_RUN_AS_NODE=1, *is* a Node interpreter. Verified: it
#     reports node v24.18.1 and runs this server. So no "install Node on PATH" prerequisite, and no
#     hard-coded node.exe.
#
#   args / cwd: !!js ctx.get('profileContext').dir + ...
#     `ctx.profileContext` is the app-boot service carrying the profile's locations; `.dir` is its
#     profile directory. The server is a declared dependency, so the profile that installed this
#     bundle has it at <profile>/node_modules/illustrator-mcp-server (pnpm nodeLinker: hoisted).
#
#     Do NOT reach for process.env.DSH_PROFILE_DIR here. That variable is injected into *shell calls*
#     by @deepseek-ai/dsh-shell-env; it is not in the host process environment. Reading it gives
#     undefined, the expression still evaluates (undefined + '…' is a valid string), and the row then
#     fails only at spawn with ENOENT — the bundle loads and the row mounts, but reports
#     fiberPhase: failed. That is exactly how this file was wrong once.
#
# !!js scalars inside `config` are Loader expressions evaluated against the row plugin's context, with
# global fallthrough (which is where `process` comes from).
#
# The two budgets below are constants of this file. 180000 for the normal budget is measured rather
# than guessed: with 60000, a NORMAL call (list_fonts) hit its deadline while Illustrator 29 was still
# cold-starting. Edit them here and reinstall, or edit the installed copy directly.
#
# There is deliberately no settings page. dsh-settings can only serve a namespace — and therefore
# offer a page — for a row whose own schema declares a volatile field, and this row's schema belongs
# to @deepseek-ai/dsh-mcp-client. A page therefore cost a second row in this bundle's list plus a
# host half to publish saved values; revision 0.4.0 removed both rather than keep that price.

- insert:
    - id: mcp-illustrator
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: illustrator
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js ctx.get('profileContext').dir + '/node_modules/illustrator-mcp-server/dist/index.js'
        cwd: !!js ctx.get('profileContext').dir + '/node_modules/illustrator-mcp-server'
        env:
          ELECTRON_RUN_AS_NODE: '1'
          ILLUSTRATOR_MCP_TIMEOUT_NORMAL: '180000'
          ILLUSTRATOR_MCP_TIMEOUT_HEAVY: '180000'
        failOnStartupError: true
        toolCallTimeoutMs: 300000
