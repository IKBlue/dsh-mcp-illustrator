# dsh-mcp-illustrator — bundle layer
#
# Mounted by the plugin manager (`install_bundle`), or by
# `dsh plugin --profile <profile> add <spec>`, so a profile gets this row
# without anyone hand-editing the profile's own cordis.patch.yml.
#
# There is deliberately NO absolute path anywhere in this file. Two things make
# that work, and both matter on a machine that has never seen this repo:
#
#   command: !!js process.execPath
#     The Harness executable, run with ELECTRON_RUN_AS_NODE=1, *is* a Node
#     interpreter. Verified: it reports node v24.18.1 and runs this server.
#     So no "install Node on PATH" prerequisite, and no hard-coded node.exe.
#
#   args / cwd: !!js ctx.get('profileContext').dir + ...
#     `ctx.profileContext` is the app-boot service carrying the profile's
#     locations; `.dir` is its profile directory. The server is a declared
#     dependency, so the profile that installed this bundle has it at
#     <profile>/node_modules/illustrator-mcp-server (pnpm nodeLinker: hoisted).
#
#     Do NOT reach for process.env.DSH_PROFILE_DIR here. That variable is
#     injected into *shell calls* by @deepseek-ai/dsh-shell-env; it is not in the
#     host process environment. Reading it gives undefined, the expression still
#     evaluates (undefined + '…' is a valid string), and the row then fails only
#     at spawn with ENOENT — the bundle loads and the row mounts, but reports
#     fiberPhase: failed. That is exactly how this file was wrong once.
#
# !!js scalars inside `config` are Loader expressions evaluated against the row
# plugin's context, with global fallthrough (which is where `process` comes from).

- insert:
    - id: mcp-illustrator
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: illustrator
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js ctx.get('profileContext').dir + '/node_modules/illustrator-mcp-server/dist/index.js'
        cwd: !!js ctx.get('profileContext').dir + '/node_modules/illustrator-mcp-server'
        env:
          ELECTRON_RUN_AS_NODE: '1'
          # The server reads both of these ONCE, at server start (they are module-level
          # constants in dist/executor/jsx-runner.js), so a new value needs this row to be
          # remounted.  Two things can remount it: restarting DSH, or the timeouts row's host
          # half, which disables and re-enables this row through the plugin manager after a save
          # so the expressions below are re-evaluated.  The host half must do it, not the browser
          # half: a client plugin reaches pluginManager only through the remote gateway, which
          # mounts the faces a client package declares for itself — from this bundle the call is
          # accepted and never answered, which reads as a hang.
          #
          # 60000 is measured insufficient, not guessed at: when the server has to cold-start
          # Illustrator, a NORMAL call (list_fonts) hit the 60s deadline while Illustrator 29
          # was still coming up. The cold-start duration itself was not measured, so 180000 is
          # margin, not a measurement.
          #
          # The fallback is the host process environment, which lib/index.js publishes the
          # configured budgets into — but only while a budget differs from the default below,
          # so `setx ILLUSTRATOR_MCP_TIMEOUT_NORMAL 240000` still works for anyone who never
          # opens the configuration page.
          ILLUSTRATOR_MCP_TIMEOUT_NORMAL: !!js (process.env.ILLUSTRATOR_MCP_TIMEOUT_NORMAL || 180000) + ''
          # Kept below toolCallTimeoutMs (300000) on purpose: the inner timeout carries the
          # actionable error, the outer one is generic.
          ILLUSTRATOR_MCP_TIMEOUT_HEAVY: !!js (process.env.ILLUSTRATOR_MCP_TIMEOUT_HEAVY || 180000) + ''
        failOnStartupError: true
        toolCallTimeoutMs: 300000

    # The row the configuration page configures.
    #
    # Settled by experiment, not by inference: a row whose module lives in the *profile's*
    # node_modules does import — this entry reaches fibre phase `active` — so a third-party
    # bundle can declare a host row of its own.  The earlier `failed to import` on
    # `mcp-illustrator-config` came with `dsh.client.inject: []`; the working version lists
    # the packages the browser half needs.  An empty inject list is therefore the suspect
    # for that failure, and it is avoided here.
    #
    # This row runs no server.  It exists so there is an entry whose Config schema carries
    # the two timeout numbers, and so the browser half has a row to attach to.  `normal` /
    # `heavy` below are the layer's defaults, and "reset to default" in the page means
    # deleting the user override so these apply again.
    #
    # The two fields are declared `volatile()` in lib/index.js, and that is load-bearing
    # rather than stylistic.  dsh-settings serves a namespace only for entries whose schema
    # declares a volatile field (`describe()` drops the rest), so without it the namespace
    # is never served, the page's `whileServed` gate never fires, and this row shows no
    # configuration at all — which is what 0.2.1 did.  Volatility also means the Loader
    # commits a save into the running references WITHOUT remounting this row, which is why
    # lib/index.js watches those references on a timer instead of reacting to a callback.
    - id: mcp-illustrator-timeouts
      name: 'dsh-mcp-illustrator'
      config:
        normal: 180000
        heavy: 180000
